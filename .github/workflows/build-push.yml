name: build and push image
on:
  push:
    branches:
      - main
env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  CONFIG_REPO: idp-skripsi/dev-py-00-config
jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: checkout code
        uses: actions/checkout@v6
      - name: set up docker build
        uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha, format=short
      - name: build and push
        uses: docker/build-push-action@v4
        with:
          labels: ${{ steps.meta.outputs.labels }}
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
      - name: checkout config repo
        uses: actions/checkout@v6
        with:
          repository: ${{ env.CONFIG_REPO }}
          token: ${{ secrets.CONFIG_REPO_TOKEN }}
          path: config
      - name: update image and push config
        working-directory: config
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.version }}
        run: |
          kustomize version
          kustomize edit set image \
            ${{ env.IMAGE_NAME }}=${{ env.IMAGE_NAME }}:${IMAGE_TAG}
          echo "Updated image tag to ${IMAGE_TAG}"
          kubectl kustomize .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add kustomization.yaml

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update dev-py-00-app image to ${IMAGE_TAG}"
          git push origin HEAD:main